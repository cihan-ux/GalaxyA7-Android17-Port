name: Android 10-17 - Reklamsiz APK
on:
  push:
    branches: [adfree-systemcheck-android10-17]
    paths:
      - 'AdFreeSystemCheck/**'
      - '.github/workflows/adfree-systemcheck.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: AdFreeSystemCheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SistemKontrolu-Android10-17-debug-APK
          path: AdFreeSystemCheck/app/build/outputs/apk/debug/app-debug.apk
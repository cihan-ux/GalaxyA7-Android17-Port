name: Exynos7885 A7 model-specific mailbox doorbell C prototype compile (UNBOUND)
'on':
  push:
    branches: [dev/evidence-based-source-audit]
    paths:
      - '.github/workflows/a7-acpm-mailbox-prototype.yml'
      - 'port/linux-6.15/drivers/mailbox/exynos7885-acpm-mbox-prototype.c'
      - 'tools/check_exynos7885_acpm_mailbox_prototype.py'
      - 'tests/test_exynos7885_acpm_mailbox_prototype.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-mailbox-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Exynos7885-specific mailbox source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run mailbox physical register provenance tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mbox-evidence
          python3 -m unittest discover -s tests -p test_exynos7885_acpm_mailbox_prototype.py -v

      - name: Fetch immutable old/new mailbox sources, compare physical register map
        shell: bash
        run: |
          set -euo pipefail
          old=https://raw.githubusercontent.com/exynos7885-dev/kernel_samsung_exynos7885/6020dfa8315134187f07ca903c9d2ed7ee0256f5
          modern=https://raw.githubusercontent.com/Mollomm1/linux-exynos7885/c9639f4bb4a8b307dea059b404d5f0a8b0fe0e4c
          curl -fLsS --retry 3 "$old/drivers/soc/samsung/acpm/acpm_ipc.h" \
            -o mbox-evidence/old-acpm-ipc.h
          curl -fLsS --retry 3 "$old/drivers/soc/samsung/acpm/acpm_ipc.c" \
            -o mbox-evidence/old-acpm-ipc.c
          curl -fLsS --retry 3 "$modern/drivers/mailbox/exynos-mailbox.c" \
            -o mbox-evidence/new-exynos-mailbox.c
          curl -fLsS --retry 3 "$modern/drivers/mailbox/Makefile" \
            -o mbox-evidence/kernel-mailbox-Makefile
          curl -fLsS --retry 3 "$modern/drivers/mailbox/Kconfig" \
            -o mbox-evidence/kernel-mailbox-Kconfig
          python3 tools/check_exynos7885_acpm_mailbox_prototype.py \
            --old-header mbox-evidence/old-acpm-ipc.h \
            --old-implementation mbox-evidence/old-acpm-ipc.c \
            --modern-mailbox mbox-evidence/new-exynos-mailbox.c \
            --kernel-makefile mbox-evidence/kernel-mailbox-Makefile \
            --kernel-kconfig mbox-evidence/kernel-mailbox-Kconfig \
            | tee mbox-evidence/provenance-result.log
          sha256sum mbox-evidence/old-acpm-ipc.h mbox-evidence/old-acpm-ipc.c \
            mbox-evidence/new-exynos-mailbox.c \
            > mbox-evidence/pinned-source-sha256.txt

      - name: Install AArch64 kernel compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git make clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev dwarves zstd

      - name: Fetch pinned Linux 6.15 Exynos7885 research kernel
        shell: bash
        run: |
          set -euo pipefail
          git init kernel
          git -C kernel remote add origin https://github.com/Mollomm1/linux-exynos7885.git
          git -C kernel -c protocol.version=2 fetch --depth 1 --filter=blob:none \
            origin c9639f4bb4a8b307dea059b404d5f0a8b0fe0e4c
          git -C kernel checkout --detach FETCH_HEAD
          test "$(git -C kernel rev-parse HEAD)" = c9639f4bb4a8b307dea059b404d5f0a8b0fe0e4c

      - name: Explicitly compile model-specific mailbox platform driver, WITHOUT integration
        shell: bash
        run: |
          set -euo pipefail
          cp port/linux-6.15/drivers/mailbox/exynos7885-acpm-mbox-prototype.c \
            kernel/drivers/mailbox/
          ! grep -q 'exynos7885-acpm-mbox-prototype' kernel/drivers/mailbox/Makefile
          make -C kernel O="$GITHUB_WORKSPACE/mbox-out" ARCH=arm64 LLVM=1 defconfig \
            2>&1 | tee mbox-evidence/defconfig.log
          make -C kernel -j2 O="$GITHUB_WORKSPACE/mbox-out" ARCH=arm64 LLVM=1 \
            drivers/mailbox/exynos7885-acpm-mbox-prototype.o \
            2>&1 | tee mbox-evidence/arm64-build.log
          obj=mbox-out/drivers/mailbox/exynos7885-acpm-mbox-prototype.o
          test -s "$obj"
          readelf -h "$obj" | tee mbox-evidence/elf-header.txt
          readelf -h "$obj" | grep -q 'Machine:.*AArch64'
          sha256sum "$obj" > mbox-evidence/object-sha256.txt

      - name: Preserve compile/source evidence only, no bootable driver/ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7-exynos7885-acpm-mailbox-C-prototype-NOT-INTEGRATED
          path: |
            mbox-evidence/*.txt
            mbox-evidence/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: State no on-device or enabled driver validation
        if: always()
        shell: bash
        run: |
          {
            echo '## Exynos7885 AP2APM mailbox prototype, not active in any kernel'
            echo 'Legacy AP->APM sends BIT(channel)<<16 to INTGR0=0x08; GS101 uses INTGR1=0x40.'
            echo 'Uses separate prototype-only compatible; no DT, Kconfig or Makefile registration.'
            echo 'A compiled .o is not firmware IPC functionality. No phone access or flashable image.'
            echo 'Before binding, need validated Exynos7885 firmware state, mailbox clock, shared SRAM and IRQ semantics.'
          } >> "$GITHUB_STEP_SUMMARY"

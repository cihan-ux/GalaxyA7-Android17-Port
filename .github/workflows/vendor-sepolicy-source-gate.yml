name: Samsung vendor metadata and SELinux source gate
on:
  workflow_dispatch:
  push:
    branches: [dev/evidence-based-source-audit]
    paths: ['.github/workflows/vendor-sepolicy-source-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect pinned source metadata without downloading proprietary binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, urllib.request
          repos = {
            'proprietary_vendor_samsung_a7y18lte': ('5e79a4f2536f755a1356636794df4b1bf0cfe780','a7y18lte-vendor.mk'),
            'proprietary_vendor_samsung_exynos7885-common': ('51a9202e8b6d5e4852fdfbb31e5cd1e6769599af','exynos7885-common-vendor.mk'),
            'hardware_samsung': ('082709ec235fd60f55bff0fb0deb8eae12bf0622','mkbootimg.mk'),
          }
          policy_repos = {
            'android_device_lineage_sepolicy': ('02f04d2b0a57f1c7435dc9f2ce8fac2640b38782','exynos/sepolicy.mk'),
            'android_device_samsung_slsi_sepolicy': ('9968b62f8f76c22143a8fc7491440aa11c32e6f4','sepolicy.mk'),
          }
          lines=['# Pinned source metadata gate','','No proprietary blobs were downloaded or copied into this repository.','','| Repository | Revision | Required source file | Present |','|---|---|---|---|']
          for name,(sha,required) in {**repos, **policy_repos}.items():
            owner='LineageOS' if name in policy_repos else 'exynos7885-dev'
            url=f'https://api.github.com/repos/{owner}/{name}/git/trees/{sha}?recursive=1'
            request=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'galaxy-a7-source-gate'})
            with urllib.request.urlopen(request,timeout=25) as response:
              data=json.load(response)
            if data.get('truncated'): raise RuntimeError(f'Truncated tree: {name}')
            paths={item['path'] for item in data['tree']}
            found=required in paths
            lines.append(f'| `{name}` | `{sha[:12]}` | `{required}` | {found} |')
            if not found: raise RuntimeError(f'Missing expected file {name}/{required}')
          lines+=['','## Still blocked','','- Proprietary vendor binary origin and SM-A750F firmware match are not verified.','- Both required SELinux policy source providers are now pinned and their expected makefiles verified; policy compilation and compatibility remain untested.','- No full LineageOS 18.1 Soong configuration or ROM build has been attempted.','- Source metadata presence does not authorize redistributing blobs.']
          open('evidence/vendor-sepolicy-gate.md','w').write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendor-sepolicy-source-gate-evidence
          path: evidence/
          retention-days: 7
